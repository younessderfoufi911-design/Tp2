<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Communes Maroc</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    #map {
      width: 100%;
      height: 100vh; 
    }
    .info {
      padding: 10px 15px;
      font-size: 14px;
      background: white;
      background: rgba(255,255,255,0.9);
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      border-radius: 5px;
      max-width: 250px;
    }
    .info h4 {
      margin: 0 0 10px;
      color: #333;
      font-size: 16px;
      border-bottom: 2px solid #cb181d;
      padding-bottom: 5px;
    }
    .info b {
      color: #cb181d;
    }
    #properties-panel {
      position: absolute;
      top: 20px;
      right: 20px;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.521);
      max-width: 400px;
      max-height: 80vh;
      overflow-y: auto;
      z-index: 1000;
      display: none;
      animation: slideIn 0.3s ease-out;
    }    
    @keyframes slideIn {
      from {
        transform: translateX(100%);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }
    #properties-panel h3 {
      margin: 0 0 15px 0;
      color: #cb181d;
      font-size: 18px;
      border-bottom: 2px solid #cb181d;
      padding-bottom: 10px;
    }
    .close-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #cb181d;
      color: white;
      border: none;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      cursor: pointer;
      font-size: 18px;
      font-weight: bold;
      transition: background 0.3s;
    }  
    .close-btn:hover {
      background: #a00;
    } 
    .property-table {
      width: 100%;
      border-collapse: collapse;
    }  
    .property-table tr {
      border-bottom: 1px solid #eee;
    }  
    .property-table td {
      padding: 8px 5px;
      font-size: 13px;
    }
    .property-table td:first-child {
      font-weight: bold;
      color: #666;
      width: 40%;
    } 
    .property-table td:last-child {
      color: #333;
    }
    .region-3d {
      filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.764));
      transform: translateY(9px);
      transition: all 0.3s ease;
    }
  </style>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="communes.geojson" type="text/javascript"></script>
</head>
<body>
  <div id="map"></div>
  <div id="properties-panel">
    <button class="close-btn" onclick="closePanel()">×</button>
    <h3 id="panel-title">Propriétés de la Région</h3>
    <table class="property-table" id="properties-table"></table>
  </div>

  <script>
    var map = L.map('map').setView([33.9763070, -6.8673408], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);
    var info = L.control();
    info.onAdd = function (map) {
        this._div = L.DomUtil.create('div', 'info');
        this.update();
        return this._div;
    };
    info.update = function (props) {
        this._div.innerHTML = '<h4>Régions du Maroc</h4>' + 
            (props ? 
                '<b>' + (props.nom_region || props.name || 'Non défini') + '</b><br />' + 
                'Population: ' + (props.Populatio || props.Population || 'N/A') + '<br />'
                : 'Survolez une région');
    };
    info.addTo(map);
    function getColor(d) {
        return d > 3162277.66 ? '#cb181d' :
               d > 1000000.00  ? '#fb6a4a' :
               d > 316227.77   ? '#fcae91' :
                                 '#fee5d9';
    }
    function style(feature) {
        return {
            fillColor: getColor(feature.properties.Populatio || feature.properties.Population || 0),
            weight: 2,
            opacity: 1,
            color: 'white',
            dashArray: '3',
            fillOpacity: 0.5
        };
    }

    var selectedLayer = null;
    function highlightFeature(e) {
        var layer = e.target;

        if (layer !== selectedLayer) {
            layer.setStyle({
                weight: 5,
                color: '#666',
                dashArray: '',
                fillOpacity: 0.8
            });
        }
        if (!L.Browser.ie && !L.Browser.opera && !L.Browser.edge) {
            layer.bringToFront();
        }
        info.update(layer.feature.properties);
    }
    function resetHighlight(e) {
        var layer = e.target;
        
        if (layer !== selectedLayer) {
            geojson.resetStyle(e.target);
        }
        
        info.update();
    }

    function zoomToFeature(e) {
        var layer = e.target;
        if (selectedLayer && selectedLayer !== layer) {
            geojson.resetStyle(selectedLayer);
            selectedLayer.getElement().classList.remove('region-3d');
        }
        selectedLayer = layer;
        layer.setStyle({
            weight: 6,
            color: '#cb181d',
            dashArray: '',
            fillOpacity: 1
        });
        if (layer.getElement()) {
            layer.getElement().classList.add('region-3d');
        }
        map.fitBounds(e.target.getBounds());
        showProperties(layer.feature.properties);
    }
    function showProperties(props) {
        var panel = document.getElementById('properties-panel');
        var table = document.getElementById('properties-table');
        var title = document.getElementById('panel-title');
        title.textContent = props.Nom || props.name || 'Région Sélectionnée';
        table.innerHTML = '';
        for (var key in props) {
            if (props.hasOwnProperty(key)) {
                var row = table.insertRow();
                var cell1 = row.insertCell(0);
                var cell2 = row.insertCell(1);
                cell1.textContent = key;
                cell2.textContent = props[key] !== null && props[key] !== undefined ? props[key] : 'N/A';
            }
        }
        panel.style.display = 'block';
    }
    function closePanel() {
        document.getElementById('properties-panel').style.display = 'none';
        if (selectedLayer) {
            geojson.resetStyle(selectedLayer);
            if (selectedLayer.getElement()) {
                selectedLayer.getElement().classList.remove('commune-3d');
            }
            selectedLayer = null;
        }
    }
    function onEachFeature(feature, layer) {
        layer.on({
            mouseover: highlightFeature,
            mouseout: resetHighlight,
            click: zoomToFeature
        });
    }
    var geojson = L.geoJson(communes, {
        style: style,
        onEachFeature: onEachFeature
    }).addTo(map);
  </script>
</body>
</html>
